# Веб-студия контента: nginx → uvicorn внутри процесса бота.
# Шаблон: DOMAIN и UPSTREAM_PORT подставляет scripts/setup_studio_web.sh.
# HTTPS добавляет certbot (--nginx), он же поставит редирект с 80 порта.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # Код доступа приходит в Telegram, но страницу лучше не отдавать поисковикам.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 4m;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:UPSTREAM_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ход генерации идёт фоновой задачей, но запас по таймаутам нужен:
        # опрос статуса и выгрузка дерева объектов на больших базах.
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:UPSTREAM_PORT/static/;
        proxy_set_header Host $host;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }
}
